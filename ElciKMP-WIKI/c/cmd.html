    <style>
        :root {
            --crt-bg: #010101;
            --crt-green: #1a7a4a;
            --crt-amber: #997000;
            --crt-text: #88aa99;
            --crt-muted: #445544;
            --crt-glow: 0 0 6px rgba(26,122,74,0.5);
            --crt-border: #0f1a14;
            --crt-font: 'VT323', 'IBM Plex Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: var(--crt-text);
            font-family: var(--crt-font);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 9999;
            animation: scanline 0.1s linear infinite;
        }
        @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(2px); } }

        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9997;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        .crt-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            border: 4px solid var(--crt-border);
            border-radius: 0;
            box-shadow: var(--crt-glow), inset 0 0 60px rgba(0,0,0,0.9);
            padding: 24px 20px;
            overflow: hidden;
            animation: flicker 0.08s infinite alternate;
            display: flex;
            flex-direction: column;
        }
        @keyframes flicker { 0% { opacity: 0.92; } 100% { opacity: 1; } }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            font-size: 20px;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--crt-text);
            text-shadow: 0 0 3px var(--crt-glow);
            scrollbar-width: thin;
            scrollbar-color: var(--crt-muted) transparent;
        }
        .terminal-output::-webkit-scrollbar { width: 6px; }
        .terminal-output::-webkit-scrollbar-track { background: transparent; }
        .terminal-output::-webkit-scrollbar-thumb { background: var(--crt-muted); border-radius: 4px; }

        .line { opacity: 0; animation: fadeIn 0.2s forwards; display: flex; align-items: center; gap: 6px; min-height: 24px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

        .command-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 20px;
            color: var(--crt-text);
        }
        .prompt { color: var(--crt-green); font-weight: bold; white-space: pre; }
        #commandInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--crt-text);
            font-family: var(--crt-font);
            font-size: 20px;
            caret-color: var(--crt-green);
        }
        #commandInput::placeholder { color: var(--crt-muted); opacity: 0.7; }

        .question-mark-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: 2px solid var(--crt-green);
            border-radius: 50%;
            background: transparent;
            color: var(--crt-green);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .question-mark-btn:hover {
            background: var(--crt-green);
            color: #000;
            box-shadow: 0 0 15px var(--crt-green);
        }

        .skip-btn {
            position: absolute;
            top: 16px;
            left: 20px;
            padding: 4px 12px;
            background: transparent;
            border: 1px solid var(--crt-amber);
            color: var(--crt-amber);
            font-family: var(--crt-font);
            font-size: 18px;
            cursor: pointer;
            z-index: 10001;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .skip-btn:hover {
            background: var(--crt-amber);
            color: #000;
            box-shadow: 0 0 10px var(--crt-amber);
        }

        .maq-panel {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            width: 300px;
            max-height: 70vh;
            overflow-y: auto;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--crt-muted);
            padding: 12px;
            z-index: 10002;
            font-size: 16px;
        }
        .maq-panel.visible { display: block; animation: fadeIn 0.3s forwards; }
        .maq-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            color: var(--crt-amber);
        }
        .maq-item:hover { background: rgba(51,255,153,0.1); }
        .maq-item .q-symbol { color: var(--crt-green); font-weight: bold; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--crt-muted);
            border-top: 1px solid var(--crt-border);
            padding-top: 8px;
            margin-top: 8px;
        }

        .progress-line { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .block-bar { font-family: var(--crt-font); letter-spacing: 0; }
        .progress-label { color: var(--crt-amber); font-size: 16px; }

        /* Bozulma aşamaları */
        .phase-flicker { animation: phaseFlicker 0.1s infinite alternate; }
        @keyframes phaseFlicker {
            0% { opacity: 0.9; filter: brightness(1); }
            100% { opacity: 1; filter: brightness(1.2); }
        }
        .phase-garble { animation: phaseGarble 0.15s steps(2) infinite; }
        @keyframes phaseGarble {
            0% { transform: translate(0, 0) skew(0); }
            25% { transform: translate(-2px, 1px) skew(0.5deg); }
            50% { transform: translate(2px, -1px) skew(-0.5deg); }
            75% { transform: translate(-1px, 2px) skew(0.2deg); }
            100% { transform: translate(1px, -2px) skew(-0.2deg); }
        }
        .phase-shatter { animation: phaseShatter 0.3s infinite; }
        @keyframes phaseShatter {
            0% { filter: none; transform: scale(1); }
            20% { filter: hue-rotate(30deg) saturate(2); transform: scale(1.01); }
            40% { filter: blur(1px); transform: scale(0.99); }
            60% { filter: invert(0.8); transform: scale(1.02); }
            80% { filter: hue-rotate(-50deg); transform: scale(0.98); }
            100% { filter: none; transform: scale(1); }
        }
        .phase-unreadable { animation: phaseUnreadable 0.4s infinite; }
        @keyframes phaseUnreadable {
            0% { filter: blur(2px) brightness(0.3); }
            50% { filter: blur(5px) brightness(0.1); }
            100% { filter: blur(2px) brightness(0.3); }
        }

            --crt-green: #ff3333;
            --crt-amber: #ff9966;
            --crt-text: #ffcccc;

            height: 8px;

            display: none;

        - Britannia Hadrian's Wall (sector read error)
        - Sun Pala outpost – awaiting diplomatic resolution.
        Type "HELP" to display commands.

`;

        // ==================== YARDIMCILAR ====================
        const terminal = document.getElementById('terminalOutput');
        const commandLine = document.getElementById('commandLine');
        const commandInput = document.getElementById('commandInput');
        const qButton = document.getElementById('questionMarkBtn');
        const maqPanel = document.getElementById('maqPanel');
        const clockEl = document.getElementById('clock');
        const skipBtn = document.getElementById('skipBtn');
        const crtScreen = document.getElementById('crtScreen');
        const glitchBand = document.getElementById('glitchBand');

        let skipRequested = false;

        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('tr-TR', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function typewriterLine(text, speed = 1) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'line';
            terminal.appendChild(lineDiv);
            terminal.scrollTop = terminal.scrollHeight;

            for (let char of text) {
                if (skipRequested) {
                    lineDiv.textContent = text;
                    break;
                }
                lineDiv.textContent += char;
                await new Promise(r => setTimeout(r, speed));
                terminal.scrollTop = terminal.scrollHeight;
            }
            return lineDiv;
        }

        async function drawBlockBar(speed = 300) {
            const barLine = document.createElement('div');
            barLine.className = 'progress-line';
            terminal.appendChild(barLine);
            terminal.scrollTop = terminal.scrollHeight;

            const barSpan = document.createElement('span');
            barSpan.className = 'block-bar';
            barLine.appendChild(barSpan);

            const label = document.createElement('span');
            label.className = 'progress-label';
            barLine.appendChild(label);

            const totalBlocks = 10;
            const target = 100;
            for (let i = 0; i <= target; i++) {
                if (skipRequested) {
                    barSpan.textContent = '▨'.repeat(totalBlocks);
                    label.textContent = '100%';
                    break;
                }
                const filled = Math.round((i / target) * totalBlocks);
                barSpan.textContent = '▨'.repeat(filled) + '▩'.repeat(totalBlocks - filled);
                label.textContent = `${i}%`;
                await new Promise(r => setTimeout(r, speed / target));
                terminal.scrollTop = terminal.scrollHeight;
            }
        }

        async function showThinking() {
            const thinkDiv = document.createElement('div');
            thinkDiv.className = 'line';
            terminal.appendChild(thinkDiv);
            terminal.scrollTop = terminal.scrollHeight;

            const base = 'Düşünüyor';
            for (let i = 0; i < 4; i++) {
                thinkDiv.textContent = base + '.'.repeat(i % 4);
                await new Promise(r => setTimeout(r, 300));
                terminal.scrollTop = terminal.scrollHeight;
            }
            thinkDiv.textContent = '';
        }

        function spawnRedParticles(count) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (2 + Math.random() * 3) + 's';
                p.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 5000);
            }
        }

        async function applyAdminPhases() {
            crtScreen.classList.add('phase-flicker');
            document.body.classList.add('red-theme');
            spawnRedParticles(20);
            await new Promise(r => setTimeout(r, 1000));
            crtScreen.classList.remove('phase-flicker');

            crtScreen.classList.add('phase-garble');
            await new Promise(r => setTimeout(r, 2000));
            crtScreen.classList.remove('phase-garble');

            crtScreen.classList.add('phase-shatter');
            await new Promise(r => setTimeout(r, 2000));
            crtScreen.classList.remove('phase-shatter');

            crtScreen.classList.add('phase-unreadable');
        }

        function startAdminQuake() {
            glitchBand.classList.add('active');
        }

        function stopAdminQuake() {
            glitchBand.classList.remove('active');
        }

        // ==================== MAQ & REQ ====================
        async function fetchQA() {
            try {
                const res = await fetch('maintext/QA.txt', { cache: 'no-store' });
                if (!res.ok) throw new Error('QA.txt bulunamadı');
                return await res.text();
            } catch (e) { console.error(e); return ''; }
        }

        function parseQAData(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const data = { maqs: [], reqs: [] };
            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                if (line.startsWith('<maq>')) {
                    const question = line.substring(5).trim();
                    i++;
                    let answer = '';
                    while (i < lines.length && !lines[i].startsWith('<maq/>')) {
                        answer += lines[i] + '\n';
                        i++;
                    }
                    i++;
                    data.maqs.push({ question, answer: answer.trim() });
                    continue;
                }
                if (line.startsWith('<REQ>')) {
                    const command = line.substring(5).trim();
                    i++;
                    let response = '';
                    let admin = false;
                    while (i < lines.length && !lines[i].startsWith('<REQ/')) {
                        response += lines[i] + '\n';
                        i++;
                    }
                    if (i < lines.length && lines[i].startsWith('<REQ/')) {
                        admin = lines[i].includes('admin');
                        i++;
                    }
                    data.reqs.push({ command, response: response.trim(), admin });
                    continue;
                }
                i++;
            }
            return data;
        }

        // ==================== BAŞLAT ====================
        async function bootSequence() {
            const bootLines = BOOT_TEXT.split('\n');
            for (const line of bootLines) {
                if (skipRequested) break;
                await typewriterLine(line, 1);
                if (/\[.*\]/.test(line)) {
                    await drawBlockBar(300);
                }
            }

            if (skipBtn) skipBtn.style.display = 'none';
            commandLine.style.display = 'flex';
            commandInput.focus();

            // MAQ yükle
            const qaText = await fetchQA();
            const data = parseQAData(qaText);

            if (data.maqs.length > 0) {
                maqPanel.innerHTML = '';
                data.maqs.forEach((maq, index) => {
                    const item = document.createElement('div');
                    item.className = 'maq-item';
                    item.innerHTML = `<span class="q-symbol">[?]</span> ${maq.question}`;
                    item.addEventListener('click', async () => {
                        await showThinking();
                        await typewriterLine('> ' + maq.question, 10);
                        for (const ansLine of maq.answer.split('\n')) {
                            await typewriterLine(ansLine, 10);
                        }
                        commandInput.focus();
                    });
                    maqPanel.appendChild(item);
                });
            } else {
                maqPanel.innerHTML = '<div class="line">Soru bulunamadı.</div>';
            }

            qButton.addEventListener('click', () => {
                maqPanel.classList.toggle('visible');
            });

            // Komut işleme
            let waitingForYN = false;
            let ynResolver = null;

            commandInput.addEventListener('keydown', async (e) => {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                const input = commandInput.value.trim();
                commandInput.value = '';

                if (waitingForYN) {
                    if (input.toUpperCase() === 'Y' || input.toUpperCase() === 'N') {
                        waitingForYN = false;
                        if (ynResolver) ynResolver(input.toUpperCase());
                    } else {
                        await typewriterLine('Lütfen Y veya N girin.', 10);
                        commandInput.focus();
                    }
                    return;
                }

                const cmdLine = document.createElement('div');
                cmdLine.className = 'line';
                terminal.appendChild(cmdLine);
                cmdLine.textContent = 'C:\\> ' + input;
                terminal.scrollTop = terminal.scrollHeight;

                const upperCmd = input.toUpperCase();

                if (upperCmd === 'HELP') {
                    const helpLines = [
                        'Mevcut komutlar:',
                        '  HELP          - bu yardım listesini gösterir',
                        '  CLS           - ekranı temizler',
                        '  VER           - sürüm bilgisini gösterir',
                        '  EXIT          - ana siteye döner'
                    ];
                    const publicReqs = data.reqs.filter(r => !r.admin);
                    publicReqs.forEach(r => {
                        helpLines.push('  ' + r.command.padEnd(12) + ' - özel komut');
                    });
                    for (const line of helpLines) {
                        await typewriterLine(line, 10);
                    }
                } else if (upperCmd === 'CLS') {
                    terminal.innerHTML = '';
                } else if (upperCmd === 'VER') {
                    await typewriterLine('ELCIKMP - DATAPAD v4.00PG', 10);
                } else if (upperCmd === 'EXIT') {
                    window.location.href = 'index.html';
                } else if (upperCmd === 'GOD IS DEAD') {
                    await applyAdminPhases();
                    startAdminQuake();
                    await showThinking();
                    await typewriterLine('> Tekrar hoşgeldiniz admin. Dosyaları görmek ister misiniz ........ Y/N?', 10);
                    commandInput.focus();

                    waitingForYN = true;
                    const answer = await new Promise(resolve => { ynResolver = resolve; });
                    ynResolver = null;

                    if (answer === 'Y') {
                        window.location.href = 'admin.html';
                    } else {
                        stopAdminQuake();
                        crtScreen.classList.remove('phase-unreadable');
                        document.body.classList.remove('red-theme');
                        await typewriterLine('Erişim iptal edildi. Sistem normale döndü.', 10);
                    }
                } else {
                    const req = data.reqs.find(r => r.command === input);
                    if (req) {
                        await showThinking();
                        for (const line of req.response.split('\n')) {
                            await typewriterLine(line, 10);
                        }
                    } else {
                        const maq = data.maqs.find(m => m.question.toLowerCase() === input.toLowerCase());
                        if (maq) {
                            await showThinking();
                            for (const ansLine of maq.answer.split('\n')) {
                                await typewriterLine(ansLine, 10);
                            }
                        } else {
                            await typewriterLine('Bilinmeyen komut. HELP yazın.', 10);
                        }
                    }
                }
                commandInput.focus();
                terminal.scrollTop = terminal.scrollHeight;
            });
        }

        skipBtn.addEventListener('click', () => {
            skipRequested = true;
            skipBtn.style.display = 'none';
        });

        bootSequence();
    })();
    </script>
</body>
