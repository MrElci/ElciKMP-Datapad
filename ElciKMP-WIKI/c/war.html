<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savaş – ElciKMP-DataPad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="layout.js"></script>
    <script src="script.js"></script>
    <script>
        (async () => {
            const layout = renderLayout({
                title: 'Savaş Detayı',
                activeTab: 'wars',
                layoutType: 'detail'
            });
            const main = layout.mainContent;

            const params = new URLSearchParams(window.location.search);
            const folder = params.get('war');
            if (!folder) { main.innerHTML = '<p>Savaş belirtilmedi.</p>'; return; }

            try {
                const info = await fetchWarInfo(folder);
                if (!info) throw new Error('Bilgi yok');

                let html = await loadWarPageContent(folder);
                main.innerHTML = html;

                if (info.classmans && info.classmans.length) {
                    const related = await getRelatedItemsByClassmans(info.classmans, folder);
                    main.innerHTML += renderRelatedItems(related);
                }

                enableImageLightbox(main);
                applyAccentColor();
                buildQuickAccess();
            } catch (e) {
                main.innerHTML = '<p>Hata: ' + e.message + '</p>';
            }
        })();
    </script>
</body>
</html>
